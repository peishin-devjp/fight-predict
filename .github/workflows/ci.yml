name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: "file:./ci-validation.db"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
      
      - name: B-2c backup and restore tests
        run: |
          node -r ts-node/register tests/b2c-backup-config.test.ts
          node -r ts-node/register tests/b2c-backup-retry.test.ts
          node -r ts-node/register tests/b2c-healthchecks.test.ts
          node -r ts-node/register tests/b2c-monitoring-separation.test.ts
          node -r ts-node/register tests/b2c-r2.test.ts
          node -r ts-node/register tests/b2c-restore-cli.test.ts
          node -r ts-node/register tests/b2c-restore-download.test.ts
          node -r ts-node/register tests/b2c-restore-validation.test.ts
          node -r ts-node/register tests/b2c-scheduler.test.ts
          node -r ts-node/register tests/b2c-sqlite-readonly.test.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://api.example.com"